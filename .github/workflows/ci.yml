name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # Base dependencies plus the default `dev` dependency group, resolved
        # exactly as uv.lock records. NOT `uv sync --all-extras`:
        #   * `otel` is excluded from MVP scope by ADR-009, so installing it in
        #     CI contradicts an accepted decision.
        #   * `nlp` (spacy, ~500MB with the model) and `umap` (numba, a known
        #     source of build friction) are deferred.
        # None of the three is imported by any gate, so installing them would
        # only add minutes and a contradiction. `--locked` fails the build if
        # uv.lock has drifted from pyproject.toml rather than silently
        # re-resolving.
        run: uv sync --locked

      - name: ruff check
        # `--exclude files` skips the vendored wiki and dev-tooling export under
        # files/linking-engine-docs/. It is tracked documentation, not
        # application source, and it is owned upstream.
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy --strict
        run: uv run mypy --strict src/ scripts/

      - name: deptry
        run: uv run deptry src/

      - name: lint-imports
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit
        # GHSA-8mgp-746c-j5xp: nltk model save/load path bypass, no fix released. We only use
        # SnowballStemmer, which is not affected. Remove the ignore once nltk ships a fix.
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx --from "pip-audit==2.9.0" pip-audit -r requirements-audit.txt --disable-pip \
            --progress-spinner off --ignore-vuln GHSA-8mgp-746c-j5xp
